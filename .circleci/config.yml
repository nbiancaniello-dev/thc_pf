version: 2.1

orbs:
  python: circleci/python@3.14.7

jobs:
  build_and_test: # this can be any name you choose
    docker:
      - image: cimg/python:3.14.7
        environment:
          DATABASE_HOST: 0.0.0.0
          DATABASE_PORT: 5433
          DATABASE_USER: postgres
          DATABASE_PASSWORD: challenge
          DATABASE_NAME: test_postgres
          DATABASE_SYNC: true
      # Service container image
      - image: cimg/postgres:18.6
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: challenge
          POSTGRES_DB: test_postgres
    executor: python/default # use the default executor defined within the orb
    steps:
      - checkout # checkout source code
      - python/install-packages:
          pkg-manager: uv
      - run:
          name: Run tests
          command: uv run pytest
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

workflows:
  build_test_deploy:
    jobs:
      - build_and_test
      - deploy:
          requires:
            - build_and_test # only deploy if the build_and_test job has completed
          filters: pipeline.git.branch == "main" #
