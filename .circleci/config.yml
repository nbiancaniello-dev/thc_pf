version: 2.1

jobs:
  test:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          version: 27.4.0
      - run:
          name: Start compose test environment
          command: docker compose -f docker-compose.test.yml up --build -d
      - run:
          name: Run tests
          command: docker compose -f docker-compose.test.yml exec -T test pytest src/tests/ -v
      - run:
          name: Cleanup
          command: docker compose -f docker-compose.test.yml down -v