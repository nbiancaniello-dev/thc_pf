[project]
name = "cursor-challenge-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nbiancaniello", email = "nbiancaniello.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
cursor-challenge-backend = "cursor_challenge_backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
