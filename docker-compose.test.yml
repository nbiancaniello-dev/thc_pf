version: '3.8'

services:
  api:
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000

  postgres:
    image: postgres:
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: challenge
      POSTGRES_DB: test_postgres